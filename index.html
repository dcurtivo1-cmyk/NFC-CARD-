<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7456e8" />
    <script>
      // Set the interface mode before the first paint. Keep the same key as
      // ColorModeToggle; card and page design settings remain independent.
      (() => {
        let preference;
        try {
          preference = localStorage.getItem("folio-studio-color-mode");
        } catch {}
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.colorMode = dark ? "dark" : "light";
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#15131d" : "#fbfaf8");
      })();
    </script>
    <meta
      name="description"
      content="Make your next introduction unforgettable. Create a digital business card, menu, or little home for your links with Folio Studio."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/loading.css" />
    <title>Folio — A little page. A lasting impression.</title>
  </head>
  <body>
    <div id="root">
      <div
        class="folio-loading folio-loading-full"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >
        <div class="loading-art" aria-hidden="true">
          <span class="loading-ripple"></span>
          <span class="loading-ripple loading-ripple-second"></span>
          <div class="loading-card">
            <span class="loading-card-brand">folio<span>.</span></span>
            <svg class="loading-signal" viewBox="0 0 32 32" fill="none">
              <circle cx="8" cy="16" r="2" fill="currentColor" />
              <path
                d="M14 10a9 9 0 0 1 0 12M19 6a15 15 0 0 1 0 20M24 2a21 21 0 0 1 0 28"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            <span class="loading-card-line"></span>
            <span class="loading-card-line loading-card-line-short"></span>
          </div>
          <span class="loading-spark"></span>
        </div>
        <div class="loading-copy">
          <p class="loading-title">Opening your page…</p>
          <p class="loading-detail">A little page. A lasting impression.</p>
        </div>
        <div class="loading-track" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <noscript>
      <style>
        .folio-loading {
          display: none;
        }
      </style>
      <p style="padding: 32px; text-align: center; font-family: sans-serif">
        Please enable JavaScript to open this page.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
