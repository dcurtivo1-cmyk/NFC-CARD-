<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7456e8" />
    <script>
      // Set the interface mode before the first paint. Keep the same key as
      // ColorModeToggle; card and page design settings remain independent.
      (() => {
        let preference;
        try {
          preference = localStorage.getItem("folio-studio-color-mode");
        } catch {}
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.colorMode = dark ? "dark" : "light";
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#15131d" : "#fbfaf8");
      })();
    </script>
    <meta
      name="description"
      content="Make your next introduction unforgettable. Create a digital business card, menu, or little home for your links with Folio Studio."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/loading.css" />
    <link rel="preload" as="image" href="/TapSync_NFC_Sync.png" />
    <title>Folio — A little page. A lasting impression.</title>
  </head>
  <body>
    <div id="root">
      <div
        class="folio-loading folio-loading-full"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >
        <div class="loading-art" aria-hidden="true">
          <span class="loading-ripple"></span>
          <span class="loading-ripple loading-ripple-second"></span>
          <div class="loading-logo-frame">
            <img
              class="loading-logo"
              src="/TapSync_NFC_Sync.png"
              alt=""
              width="500"
              height="500"
              fetchpriority="high"
            />
          </div>
        </div>
        <div class="loading-copy">
          <p class="loading-title">Opening your page…</p>
          <p class="loading-detail">TapSync · One tap. A new connection.</p>
        </div>
        <div class="loading-track" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <noscript>
      <style>
        .folio-loading {
          display: none;
        }
      </style>
      <p style="padding: 32px; text-align: center; font-family: sans-serif">
        Please enable JavaScript to open this page.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
